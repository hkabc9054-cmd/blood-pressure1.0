<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>血壓記錄</title>
<meta name="theme-color" content="#506850">
<meta name="color-scheme" content="light">
<meta name="description" content="血壓記錄：上壓、下壓、心跳，每日多時段，日／週／月平均值">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="血壓記錄">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --c1:#D3F2DE; --c2:#99C39E; --c3:#506850;
  --ink:#233127; --mute:#5b6f5f; --card:#F7FCF9; --line:#bfe0c8;
  --warn-bg:#F5E3B3; --warn-fg:#5b4300; --hi-bg:#F2C2BA; --hi-fg:#6b1f17; --lo-bg:#C9DCEB; --lo-fg:#1e3a52;
  --pulse:#B4693C;
  --radius:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--c1);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--c1);position:relative}
header.top{background:var(--c3);color:#F2FBF5;padding:calc(var(--sat) + 12px) 18px 14px;flex:none}
header.top h1{margin:0;font-size:20px;letter-spacing:.08em;font-weight:700}
header.top p{margin:2px 0 0;font-size:13px;opacity:.82}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--c3)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.4}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;margin-top:-9px;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--c3)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(80,104,80,.12)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--c3);letter-spacing:.06em}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .nav{width:44px;height:44px;border-radius:14px;background:var(--card);font-size:24px;color:var(--c3);font-weight:700;flex:none}
.datebar .nav:disabled{opacity:.35}
.datelabel{position:relative;flex:1;height:44px;border-radius:14px;background:var(--c3);color:#F2FBF5;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.03em;overflow:hidden}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.todaybtn{font-size:13px;color:var(--c3);font-weight:700;padding:6px 10px;border-radius:10px;background:var(--c2)}
/* summary */
.sum{background:var(--c3);color:#F2FBF5}
.sum h2{color:#CFE8D6}
.bigbp{font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigbp small{font-size:15px;font-weight:600;opacity:.8;margin-left:6px;letter-spacing:0}
.hr{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.hr svg{width:20px;height:20px;fill:#F2BFA4}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--c2);color:#17301c;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.hi{background:var(--hi-bg);color:var(--hi-fg)}
.badge.lo{background:var(--lo-bg);color:var(--lo-fg)}
/* slots */
.slot{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:2px solid transparent;box-shadow:0 1px 0 rgba(80,104,80,.12)}
.slot .ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--c1);display:grid;place-items:center;color:var(--c3);font-weight:800;font-size:15px}
.slot.done .ico{background:var(--c3);color:var(--c1)}
.slot.now{border-color:var(--c2)}
.slot .t{font-weight:700}
.slot .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c3)}
.slot .v small{font-size:13px;font-weight:600;color:var(--mute);margin-left:4px}
.slot .add{margin-left:auto;font-size:13px;font-weight:700;color:var(--c3);background:var(--c2);padding:6px 12px;border-radius:99px;flex:none}
.slot .chev{margin-left:auto;color:var(--mute);font-size:22px}
/* seg */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--c2);border-radius:14px;padding:3px;gap:3px}
.seg button{padding:8px 0;border-radius:11px;font-weight:700;color:#1f3322}
.seg button[aria-pressed="true"]{background:var(--c3);color:#F2FBF5}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--mute);font-weight:700}
.tile .n{font-size:26px;font-weight:800;color:var(--c3);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12px;color:var(--mute)}
/* list */
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.plist li:first-child{border-top:0}
.plist .lab{font-weight:700}
.plist .num{font-size:20px;font-weight:800;color:var(--c3);font-variant-numeric:tabular-nums;text-align:right}
.plist .sub{font-size:12px;color:var(--mute)}
.plist .pul{color:var(--pulse)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
svg.chart{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mute);padding:26px 8px;font-size:14px}
/* history */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 6px;font-weight:700;color:var(--c3)}
.dayhead span{font-size:12px;font-weight:600;color:var(--mute)}
.hrow{width:100%;text-align:left;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;background:var(--card);padding:11px 14px;border-radius:14px;margin-bottom:6px}
.hrow .sl{font-size:13px;font-weight:700;color:var(--c3)}
.hrow .bp{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.hrow .bp small{font-size:12px;color:var(--pulse);font-weight:700;margin-left:6px}
.hrow .nt{grid-column:2 / 4;font-size:12px;color:var(--mute);margin-top:-4px;word-break:break-all}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;font-weight:700;background:var(--c2);color:#17301c;min-height:44px}
.btn.pri{background:var(--c3);color:#F2FBF5}
.btn.danger{background:var(--hi-bg);color:var(--hi-fg)}
.btn.ghost{background:transparent;border:2px solid var(--c2);color:var(--c3)}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--c3);margin-bottom:4px}
.field input[type=text],.field input[type=url],.field input[type=password],.field input[type=time],.field input[type=number]{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;outline:0}
.field input:focus{border-color:var(--c3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s;border:0;outline:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--c3)}
.switch input:checked::after{left:23px}
.status{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--c1);color:var(--c3);word-break:break-all}
.status.err{background:var(--hi-bg);color:var(--hi-fg)}
.help{font-size:12.5px;color:var(--mute);margin:6px 0 0}
hr.sp{border:0;border-top:1px solid var(--line);margin:14px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(35,49,39,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + var(--sab));max-height:92%;overflow-y:auto;animation:up .2s}
.sheet h3{margin:0 0 8px;font-size:18px;color:var(--c3)}
.sheet p{margin:0 0 12px}
.sheet .err{color:var(--hi-fg);background:var(--hi-bg);border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.bpgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.bpgrid .field{margin:0}
.bpgrid input{text-align:center;font-size:24px !important;font-weight:800;padding:10px 4px !important}
.stack{display:grid;gap:8px;margin-top:6px}
.medtag{display:inline-block;background:var(--c2);color:#17301c;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px;white-space:nowrap}
.medline{margin-top:3px}
.medtag.chk{background:var(--lo-bg);color:var(--lo-fg)}
.evbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.evbtns .btn{min-height:40px;padding:8px 6px;font-size:14px}
.mhead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-weight:800;color:var(--c3);background:var(--c2);border-radius:14px;padding:12px 14px;margin:12px 0 6px;font-size:15px}
.mhead .mmeta{font-size:12px;font-weight:700;color:#1f3322;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mhead .chv{font-style:normal;font-size:16px;transition:transform .2s;transform:rotate(-90deg)}
.mhead .chv.open{transform:none}
.card .mhead{margin:8px 0 2px;background:var(--c1)}
.rhead,.rrow{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:6px;align-items:center}
.rhead{font-size:12px;font-weight:700;color:var(--c3);text-align:center;margin-bottom:2px}
.rrow{margin-bottom:6px}
.rrow .rl{font-size:13px;font-weight:700;line-height:1.2;color:var(--c3)}
.rrow .rl.r{color:#3f5a6b}
.rrow input{width:100%;text-align:center;font-size:20px;font-weight:800;padding:9px 2px;border-radius:12px;border:2px solid var(--line);background:#fff;outline:0}
.rrow input:focus{border-color:var(--c3)}
.live{background:var(--c1);border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:14px;color:var(--c3)}
.live b{font-size:20px}
.arms{font-size:12px;color:var(--mute)}
@media (min-width:560px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translateX(-50%);background:var(--c3);color:#F2FBF5;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:80;max-width:88%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:fade .15s}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="ttl">血壓記錄</h1><p id="sub"></p></header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="主選單">
    <button data-tab="today" role="tab"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9-9.3C1.8 8.6 3.5 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.5 0 5.2 3.6 4 6.7C19 16.4 12 21 12 21z"/></svg>今日</button>
    <button data-tab="stats" role="tab"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>統計</button>
    <button data-tab="history" role="tab"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>紀錄</button>
    <button data-tab="settings" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
  </nav>
</div>
<input type="file" id="fileIn" accept=".json,.csv,application/json,text/csv,text/plain" class="hidden">
<noscript>本 App 需要啟用 JavaScript。</noscript>

<script>
(function(){
'use strict';

/* ---------- 基本工具 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const fmtLong = s => { const d = parseD(s); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; };
const fmtMD = s => { const d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const weekStart = s => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDT = v => { if (!v) return '—'; const d = new Date(v); if (isNaN(d)) return '—'; return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

const mem = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] == null ? null : mem[k]; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; if (!lsSet.warned) { lsSet.warned = true; setTimeout(() => toast('瀏覽器無法儲存資料，請先匯出備份'), 300); } } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }

/* ---------- 資料 ---------- */
const SLOTS = {
  m: { name: '早上', hint: '起床後・早餐前', def: '07:30', ab: '早' },
  a: { name: '下午', hint: '午後', def: '14:30', ab: '午' },
  e: { name: '晚上', hint: '睡前', def: '21:30', ab: '晚' }
};
const SLOT_ORDER = ['m', 'a', 'e'];
const KEY_DATA = 'bp.v1.data', KEY_SYNC = 'bp.v1.sync', KEY_PREV = 'bp.v1.prev';

let db = { settings: { slots: 3 }, records: {}, meds: {}, checks: {}, modifiedAt: 0 };
let sync = { url: '', token: '', auto: false, lastSyncedAt: null, pending: false, deviceId: '', lastOk: 0 };

function loadAll() {
  try { const j = JSON.parse(lsGet(KEY_DATA) || 'null'); if (j && j.records) { db.records = j.records; db.meds = j.meds || {}; db.checks = j.checks || {}; db.settings = Object.assign({ slots: 3 }, j.settings || {}); db.modifiedAt = j.modifiedAt || 0; } } catch (e) {}
  try { const j = JSON.parse(lsGet(KEY_SYNC) || 'null'); if (j) sync = Object.assign(sync, j); } catch (e) {}
  if (!sync.deviceId) { sync.deviceId = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); saveSync(); }
}
function saveDb() { lsSet(KEY_DATA, JSON.stringify(db)); }
function saveSync() { lsSet(KEY_SYNC, JSON.stringify(sync)); }
function touch() { db.modifiedAt = Date.now(); saveDb(); scheduleAuto(); }
const rkey = (d, s) => d + '|' + s;
const allRecords = () => Object.values(db.records);
const activeSlots = () => db.settings.slots === 2 ? ['m', 'e'] : ['m', 'a', 'e'];
function slotsForDate(d) { const set = new Set(activeSlots()); SLOT_ORDER.forEach(s => { if (db.records[rkey(d, s)]) set.add(s); }); return SLOT_ORDER.filter(s => set.has(s)); }

/* ---------- 計算 ---------- */
function avgOf(list, k) { const v = list.map(r => r[k]).filter(x => typeof x === 'number' && !isNaN(x)); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; }
function summarize(list) { return { n: list.length, sys: avgOf(list, 'sys'), dia: avgOf(list, 'dia'), pulse: avgOf(list, 'pulse') }; }
function classify(sys, dia) {
  if (sys == null || dia == null) return null;
  if (sys >= 140 || dia >= 90) return { t: '偏高', c: 'hi' };
  if (sys >= 130 || dia >= 85) return { t: '正常偏高', c: 'warn' };
  if (sys < 90 || dia < 60) return { t: '偏低', c: 'lo' };
  return { t: '正常', c: '' };
}
const ARMS = [['R', 1, '右臂<br>第1次'], ['L', 1, '左臂<br>第1次'], ['R', 2, '右臂<br>第2次'], ['L', 2, '左臂<br>第2次']];
const CSV_ARMS = [['L', 1], ['L', 2], ['R', 1], ['R', 2]]; // CSV 欄位次序固定，與舊備份相容
function armAvg(rd, a) { const l = (rd || []).filter(x => x.a === a); if (!l.length) return null; return { sys: avgOf(l, 'sys'), dia: avgOf(l, 'dia'), pulse: avgOf(l, 'pulse'), n: l.length }; }
function armLine(r) {
  if (!r || !r.rd || !r.rd.length) return '';
  const L = armAvg(r.rd, 'L'), R = armAvg(r.rd, 'R'), parts = [];
  if (L) parts.push('左 ' + L.sys + '/' + L.dia); if (R) parts.push('右 ' + R.sys + '/' + R.dia);
  if (L && R) parts.push('左右差 ' + Math.abs(L.sys - R.sys));
  return parts.join(' ・ ') + ' ・ 量度 ' + r.rd.length + ' 次';
}
const isOpen = (key, idx) => ui.open[key] !== undefined ? ui.open[key] : idx === 0; // 最新一個月預設展開，其餘收起

function modal(o) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    const acts = (o.actions || [{ id: 'ok', label: '好', cls: 'pri' }]);
    ov.innerHTML = '<div class="sheet"><h3>' + esc(o.title || '') + '</h3><div class="mbody">' + (o.html || '') + '</div><div class="stack mact">' +
      acts.map(a => '<button class="btn ' + (a.cls || '') + ' block" data-mid="' + a.id + '">' + esc(a.label) + '</button>').join('') + '</div></div>';
    document.body.appendChild(ov);
    const sheet = $('.sheet', ov);
    const close = (id, data) => { document.removeEventListener('keydown', onKey, true); ov.remove(); resolve({ id: id, data: data }); };
    const trigger = id => {
      if (o.validate && id === (o.validateOn || 'save')) { const r = o.validate(sheet); if (!r) return; close(id, r); } else close(id);
    };
    function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); close(o.cancelId || 'cancel'); } else if (e.key === 'Enter' && o.enterId && e.target.tagName === 'INPUT') { e.preventDefault(); trigger(o.enterId); } }
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-mid]');
      if (b) { trigger(b.dataset.mid); return; }
      if (e.target === ov && !o.noBackdrop) close(o.cancelId || 'cancel');
    });
    if (o.onOpen) o.onOpen(sheet);
  });
}

function chartSVG(pts) {
  if (!pts.length) return '<div class="empty">暫時沒有資料</div>';
  const W = 340, H = 190, L = 34, R = 10, T = 12, B = 26;
  const vals = []; pts.forEach(p => { [p.sys, p.dia, p.pulse].forEach(v => { if (v != null) vals.push(v); }); });
  let lo = Math.floor((Math.min.apply(null, vals) - 8) / 10) * 10, hi = Math.ceil((Math.max.apply(null, vals) + 8) / 10) * 10;
  if (hi - lo < 40) hi = lo + 40;
  const x = i => pts.length === 1 ? (L + (W - L - R) / 2) : L + (W - L - R) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  const step = (hi - lo) <= 60 ? 10 : (hi - lo) <= 120 ? 20 : 40;
  for (let v = lo; v <= hi; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#bfe0c8" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="#5b6f5f">' + v + '</text>';
  const line = (k, col, dash, w) => {
    const seg = []; let cur = [];
    pts.forEach((p, i) => { if (p[k] == null) { if (cur.length) seg.push(cur); cur = []; } else cur.push([x(i), y(p[k])]); });
    if (cur.length) seg.push(cur);
    let s = '';
    seg.forEach(a => { if (a.length > 1) s += '<polyline fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' points="' + a.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/>'; });
    pts.forEach((p, i) => { if (p[k] != null) s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p[k]).toFixed(1) + '" r="3.4" fill="' + col + '" stroke="#F7FCF9" stroke-width="1.5"/>'; });
    return s;
  };
  let labs = ''; const every = Math.ceil(pts.length / 7);
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) labs += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#5b6f5f">' + esc(p.lab) + '</text>'; });
  return '<svg class="chart" id="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="血壓與心跳走勢圖">' + g + labs + line('pulse', '#B4693C', '4 4', 2) + line('dia', '#99C39E', '', 3) + line('sys', '#506850', '', 3) + '</svg>' +
    '<div class="legend"><span><i style="background:#506850"></i>上壓</span><span><i style="background:#99C39E"></i>下壓</span><span><i style="background:#B4693C"></i>心跳</span></div>';
}

function readRows(sh, strict) {

    const g = id => { const t = $(id, sh).value.trim(); return t === '' ? null : Number(t); };
    const sys = g('#r' + k + 's'), dia = g('#r' + k + 'd'), hr = g('#r' + k + 'h'), name = A[2].replace('<br>', '');
    if (sys == null && dia == null && hr == null) return;
    if (strict) {
      if (error) return;
      if (sys == null || dia == null) { error = name + '：請輸入上壓和下壓（或把整行留空）。'; return; }
      if (!Number.isInteger(sys) || sys < 50 || sys > 260) { error = name + '：上壓應在 50–260 之間。'; return; }
      if (!Number.isInteger(dia) || dia < 30 || dia > 160) { error = name + '：下壓應在 30–160 之間。'; return; }
      if (sys <= dia) { error = name + '：上壓應高於下壓，請檢查數字。'; return; }

}

    applyRecords(n.list, 'replace', r.data && r.data.settings ? r.data.settings.slots : null, normalizeMeds(r.data && r.data.meds), normalizeMeds(r.data && r.data.checks));
    db.modifiedAt = Date.now(); saveDb();
    sync.lastSyncedAt = r.updatedAt; sync.lastOk = Date.now(); sync.pending = false; autoPaused = false; saveSync();
    setStatus('下載完成 ✓ ' + n.list.length + ' 筆'); toast('已從 Google Drive 下載'); render();
  } catch (e) { setStatus('下載失敗：' + errText(e), true); } finally { syncBusy = false; }
}
function scheduleAuto(retry) {
  if (!sync.auto || !syncReady()) return;
  sync.pending = true; saveSync();
  if (autoPaused) { setStatus(baseStatus()); return; }
  if (!allRecords().length) { setStatus('本機沒有資料，已略過自動上傳（避免覆蓋雲端）。'); return; }
  clearTimeout(autoTimer);
  if (!navigator.onLine) { setStatus('離線中：改動已存在本機，恢復網絡後會自動上傳。'); return; }
  autoTimer = setTimeout(() => syncUpload({ auto: true }), retry ? 3000 : 3000);
}
window.addEventListener('online', () => { if (sync.auto && sync.pending && syncReady() && !autoPaused) { setStatus('網絡已恢復，正在補上傳…'); scheduleAuto(); } });

/* ---------- 設定 ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'settings') keepScroll(render); });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function viewSettings() {
  setHeader('設定', '時段、備份與同步');
  const prev = (() => { try { return JSON.parse(lsGet(KEY_PREV) || 'null'); } catch (e) { return null; } })();
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  let html = '<section class="card"><h2>每日記錄時段</h2><div class="seg" id="slotSeg">' +
    '<button data-act="slots" data-n="2" aria-pressed="' + (db.settings.slots === 2) + '">每日 2 次</button><button data-act="slots" data-n="3" aria-pressed="' + (db.settings.slots === 3) + '">每日 3 次</button></div>' +
    '<p class="help">2 次＝早、晚；3 次＝早、午、晚。切換後，已經記錄的資料不會消失。</p></section>';
  html += '<section class="card"><h2>備份與還原</h2><div class="btns"><button class="btn" data-act="expJson">匯出 JSON</button><button class="btn" data-act="expCsv">匯出 CSV</button></div>' +
    '<button class="btn ghost block" style="margin-top:8px" data-act="import">匯入備份（JSON / CSV）</button>' +
    (prev ? '<button class="btn ghost block" style="margin-top:8px" data-act="restorePrev">還原上一次覆蓋前的資料（' + esc(fmtDT(prev.at)) + '）</button>' : '') +
    '<p class="help">所有資料只存在這部裝置的瀏覽器內。建議定期匯出備份。備份檔不含同步密碼。</p></section>';
  html += '<section class="card"><h2>Google Drive 同步</h2>' +
    '<label class="field"><span>Apps Script 網址</span><input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocomplete="off" spellcheck="false" value="' + esc(sync.url) + '"></label>' +
    '<label class="field"><span>密碼</span><input type="password" id="sTok" autocomplete="off" value="' + esc(sync.token) + '"></label>' +
    '<div class="btns three"><button class="btn" data-act="sTest">測試連線</button><button class="btn pri" data-act="sUp">上傳</button><button class="btn" data-act="sDown">下載</button></div>' +
    '<label class="switch" style="margin-top:8px"><span>資料有改動時自動上傳<div class="muted">改動約 3 秒後上傳；離線時先存本機，有網絡後補上傳</div></span><input type="checkbox" id="sAuto"' + (sync.auto ? ' checked' : '') + '></label>' +
    '<div class="status" id="syncStatus" role="status">' + esc(statusMsg || baseStatus()) + '</div>' +
    '<p class="help">資料會存在你 Drive 的「血壓記錄」資料夾。每次覆蓋前，舊版本會自動留一份備份。密碼只存在這部裝置，不會放入匯出的備份檔。換新手機：安裝 App → 填同樣的網址和密碼 → 按「下載」。</p></section>';
  html += '<section class="card"><h2>安裝到桌面</h2>' +
    (isStandalone() ? '<p style="margin:0">✓ 已用 App 模式開啟。</p>' :
      (deferredInstall ? '<button class="btn pri block" data-act="install">安裝 App</button>' : '') +
      '<p class="help" style="margin-top:' + (deferredInstall ? '8' : '0') + 'px">' + (ios ? 'iPhone：用 Safari 開啟本頁 → 按底部「分享」圖示 → 選「加入主畫面」。' : 'Android：用 Chrome 開啟 → 右上角「⋮」→「安裝應用程式」。iPhone：用 Safari →「分享」→「加入主畫面」。') + '</p>') + '</section>';
  html += '<section class="card"><h2>危險區域</h2><button class="btn danger block" data-act="clear">清除這部裝置的所有資料</button><p class="help">不會影響 Google Drive 上已有的備份。</p></section>';
  html += '<p class="muted" style="text-align:center;margin:6px 0 0">血壓記錄 v1.0 · 分類（正常 &lt;130/85、偏高 ≥140/90）僅供參考，不能代替醫生診斷。</p>';
  main.innerHTML = html;
  $('#sUrl').addEventListener('change', e => { const u = e.target.value.trim(); if (u !== sync.url) { sync.url = u; sync.lastSyncedAt = null; } saveSync(); setStatus(baseStatus()); });
  $('#sTok').addEventListener('change', e => { sync.token = e.target.value; saveSync(); setStatus(baseStatus()); });
  $('#sAuto').addEventListener('change', e => {
    sync.auto = e.target.checked; saveSync();
    if (sync.auto) { if (needSetup()) { e.target.checked = false; sync.auto = false; saveSync(); return; } autoPaused = false; if (sync.pending) scheduleAuto(); toast('已開啟自動上傳'); } else toast('已關閉自動上傳');
  });
}
function commitSyncInputs() { const u = $('#sUrl'), t = $('#sTok'); if (u) sync.url = u.value.trim(); if (t) sync.token = t.value; saveSync(); }

/* ---------- 事件 ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('#tabs button'); if (tab) { ui.tab = tab.dataset.tab; render(); main.scrollTop = 0; return; }
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.ov')) return;
  const a = b.dataset.act;
  if (a === 'prevDay') { ui.date = addDays(ui.date, -1); render(); }
  else if (a === 'nextDay') { if (ui.date < todayStr()) { ui.date = addDays(ui.date, 1); render(); } }
  else if (a === 'goToday') { ui.date = todayStr(); render(); }
  else if (a === 'edit') openEntry(b.dataset.date, b.dataset.slot);
  else if (a === 'editEvt') openEvent(b.dataset.kind, b.dataset.date);
  else if (a === 'toggleMonth') { ui.open[b.dataset.key] = b.getAttribute('aria-expanded') !== 'true'; keepScroll(render); }
  else if (a === 'addEvt') openEvent(b.dataset.kind, todayStr(), true);
  else if (a === 'mode') { ui.mode = b.dataset.mode; render(); }
  else if (a === 'slots') { db.settings.slots = Number(b.dataset.n); touch(); keepScroll(render); toast('已改為每日 ' + b.dataset.n + ' 次'); }
  else if (a === 'expJson') exportJSON();
  else if (a === 'expCsv') exportCSV();
  else if (a === 'import') $('#fileIn').click();
  else if (a === 'restorePrev') {
    const prev = JSON.parse(lsGet(KEY_PREV) || 'null'); if (!prev) return;
    const n = Object.keys(prev.records || {}).length;
    if (await confirmBox('還原到覆蓋之前？', '<p>會把本機資料還原到 ' + esc(fmtDT(prev.at)) + ' 之前的狀態（' + n + ' 筆），目前的資料會被取代。</p>', '還原', true)) {
      db.records = prev.records; db.meds = prev.meds || {}; db.checks = prev.checks || {}; db.settings = Object.assign({ slots: 3 }, prev.settings); lsDel(KEY_PREV); touch(); render(); toast('已還原');
    }
  }
  else if (a === 'sTest') { commitSyncInputs(); syncTest(); }
  else if (a === 'sUp') { commitSyncInputs(); autoPaused = false; syncUpload(); }
  else if (a === 'sDown') { commitSyncInputs(); autoPaused = false; syncDownload(); }
  else if (a === 'install') { if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (x) {} deferredInstall = null; render(); } }
  else if (a === 'clear') {
    const n = allRecords().length, mn = Object.keys(db.meds).length, cn = Object.keys(db.checks).length;
    if (!n && !mn && !cn) return toast('目前沒有資料');
    if (await confirmBox('清除所有資料？', '<p>將刪除這部裝置上全部 <b>' + n + '</b> 筆記錄' + (mn ? '、<b>' + mn + '</b> 個取藥日期' : '') + (cn ? '、<b>' + cn + '</b> 筆驗身記錄' : '') + '，無法直接復原（清除前會留一份，可在設定內還原）。<br>建議先匯出備份。</p>', '全部清除', true)) {
      snapshotPrev('清除前'); db.records = {}; db.meds = {}; db.checks = {}; touch(); render(); toast('已清除');
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'datePick') { const v = e.target.value; if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { ui.date = v > todayStr() ? todayStr() : v; render(); } }
  else if (e.target.id === 'fileIn') { const f = e.target.files[0]; e.target.value = ''; handleFile(f); }
});

/* ---------- 啟動 ---------- */
loadAll();
render();
if (sync.auto && sync.pending && syncReady()) setTimeout(() => { if (navigator.onLine) syncUpload({ auto: true }); }, 1500);
// 日期跨日：App 回到前景時，如果停留在「今日」就更新
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.tab === 'today' && !$('.ov')) { const t = todayStr(); if (ui.lastToday && ui.lastToday !== t && ui.date === ui.lastToday) ui.date = t; ui.lastToday = t; render(); } });
ui.lastToday = todayStr();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
